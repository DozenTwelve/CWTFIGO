<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light">
<title>CWTFIGO social card</title>
<!-- Source of og-image.png (1200x630) and, as og-image.html#icon, apple-touch-icon.png (180x180). Commands in README.md. -->
<link rel="stylesheet" href="fonts.css">
<style>
:root { --paper: #f4ede0; --ink: oklch(18% 0.006 60); --ink-2: oklch(28% 0.008 60); color-scheme: light; }
html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: var(--paper); color: var(--ink); }
body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; text-align: center; font-family: "Red Hat Text", sans-serif; }
/* the banner cropped to its drawing (x 130-1240, y 97-544 of 1280x640), shown at 0.62 */
.banner { width: 688px; height: 277px; background: url(banner-light.png) -81px -60px / 794px 397px no-repeat; }
h1 { margin: 4px 0 0; font-family: "Red Hat Display", sans-serif; font-weight: 600; font-size: 60px; line-height: 1.02; letter-spacing: -0.035em; }
p { margin: 0; max-width: 900px; font-size: 32px; line-height: 1.3; color: var(--ink-2); text-wrap: balance; }
#icon { display: none; }
#icon:target { display: grid; place-items: center; position: fixed; inset: 0 auto auto 0; width: 180px; height: 180px; background: var(--paper); }
#icon img { width: 138px; height: 144px; }
</style>
</head>
<body>
<div class="banner" role="img" aria-label="CWTFIGO: an orange robot with a cigar"></div>
<h1>Claude, what the fuck is going on?</h1>
<p>Call Claude by name. It finds what’s wrong, fixes it on your OK, and remembers.</p>
<div id="icon"><img src="robot.png" alt=""></div>
</body>
</html>
